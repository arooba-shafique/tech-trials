{% load static %}
<style>
    .ie-section {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,.07);
        padding: 24px;
        margin-bottom: 20px;
    }
    .ie-section h3 {
        font-size: 16px;
        font-weight: 700;
        color: #1a1d23;
        margin: 0 0 18px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .ie-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media (max-width: 640px) {
        .ie-grid { grid-template-columns: 1fr; }
    }
    .ie-card {
        background: #f9fafb;
        border: 1.5px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px;
    }
    .ie-card h4 {
        font-size: 13px;
        font-weight: 700;
        color: #374151;
        margin: 0 0 14px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .ie-type-select {
        width: 100%;
        padding: 9px 12px;
        border: 1.5px solid #e5e7eb;
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        margin-bottom: 12px;
        background: #fff;
        transition: border-color 0.15s;
    }
    .ie-type-select:focus {
        border-color: #0d9488;
    }
    .ie-btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .ie-btn {
        padding: 9px 16px;
        border: none;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s;
        text-decoration: none;
    }
    .ie-btn-export-csv {
        background: #ecfdf5;
        color: #047857;
        border: 1.5px solid #a7f3d0;
    }
    .ie-btn-export-csv:hover {
        background: #d1fae5;
    }
    .ie-btn-export-xlsx {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1.5px solid #bfdbfe;
    }
    .ie-btn-export-xlsx:hover {
        background: #dbeafe;
    }
    .ie-btn-import {
        background: #0d9488;
        color: #fff;
    }
    .ie-btn-import:hover {
        background: #0f766e;
    }
    .ie-file-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        background: #fff;
        border: 1.5px dashed #d1d5db;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 500;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.15s;
        margin-bottom: 12px;
    }
    .ie-file-label:hover {
        border-color: #0d9488;
        color: #0d9488;
    }
    .ie-file-label input[type="file"] {
        display: none;
    }
    .ie-file-name {
        font-size: 12px;
        color: #0d9488;
        font-weight: 600;
        margin-bottom: 10px;
        min-height: 18px;
    }
    .ie-hint {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 8px;
        line-height: 1.5;
    }
</style>

<!-- ══════════════════════════════════════════
     IMPORT / EXPORT SECTION
══════════════════════════════════════════ -->
<div class="ie-section">
    <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Data Import &amp; Export
    </h3>

    <div class="ie-grid">
        <!-- EXPORT CARD -->
        <div class="ie-card">
            <h4>Export Data</h4>
            <select id="ieExportType" class="ie-type-select">
                <option value="students">Students</option>
                <option value="teachers">Teachers</option>
                <option value="parents">Parents</option>
                <option value="results">Results / Marks</option>
            </select>
            <div class="ie-btn-row">
                <a id="ieExportCsvBtn" href="/data/export/?type=students&format=csv"
                   class="ie-btn ie-btn-export-csv" download>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    CSV
                </a>
                <a id="ieExportXlsxBtn" href="/data/export/?type=students&format=xlsx"
                   class="ie-btn ie-btn-export-xlsx" download>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Excel
                </a>
            </div>
            <p class="ie-hint">Downloads a file with all records for the selected data type.</p>
        </div>

        <!-- IMPORT CARD -->
        <div class="ie-card">
            <h4>Import Data</h4>
            <form id="ieImportForm" method="POST" action="/data/import/" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="type" id="ieImportType" value="students">
                <select id="ieImportTypeSelect" class="ie-type-select">
                    <option value="students">Students</option>
                <option value="teachers">Staff (Teachers, Coordinators, VP, etc.)</option>
                    <option value="parents">Parents</option>
                    <option value="results">Results / Marks</option>
                </select>
                <label class="ie-file-label" for="ieFileInput">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Choose CSV file
                    <input type="file" name="file" id="ieFileInput" accept=".csv">
                </label>
                <div class="ie-file-name" id="ieFileName"></div>
                <button type="submit" class="ie-btn ie-btn-import">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import CSV
                </button>
            </form>
            <p class="ie-hint">Upload a CSV file. Headers must match the export format for the selected type.</p>
        </div>
    </div>
</div>

<script>
(function() {
    var exportSelect = document.getElementById('ieExportType');
    var csvBtn = document.getElementById('ieExportCsvBtn');
    var xlsxBtn = document.getElementById('ieExportXlsxBtn');

    function updateExportLinks() {
        var type = exportSelect.value;
        csvBtn.href = '/data/export/?type=' + type + '&format=csv';
        xlsxBtn.href = '/data/export/?type=' + type + '&format=xlsx';
    }
    exportSelect.addEventListener('change', updateExportLinks);

    var importSelect = document.getElementById('ieImportTypeSelect');
    var importTypeInput = document.getElementById('ieImportType');
    var hints = {
        students: 'Headers: full_name, guardian_name, date_of_birth, gender, roll_number, admission_number, class_name, class_section, phone, address, email',
        teachers: 'Headers: full_name, father_name, date_of_birth, gender, employee_id, cnic, designation (teacher/coordinator/manager/vp/group_head), employment_type (permanent/contract/daily_wager), phone, email, salary, bank_name, bank_account',
        parents: 'Headers: full_name, relation, phone, email, student_admission_numbers (comma-separated)',
        results: 'Headers: student_name, admission_number, exam_name, subject_code, class_name, class_section, total_marks, passing_marks, marks_obtained'
    };
    var hintEl = document.querySelector('.ie-card:last-child .ie-hint');

    importSelect.addEventListener('change', function() {
        importTypeInput.value = this.value;
        if (hintEl) hintEl.textContent = hints[this.value] || '';
    });

    var fileInput = document.getElementById('ieFileInput');
    var fileName = document.getElementById('ieFileName');
    fileInput.addEventListener('change', function() {
        fileName.textContent = this.files[0] ? this.files[0].name : '';
    });
})();
</script>
