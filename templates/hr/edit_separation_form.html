{% extends "hr/base_hr.html" %}

{% block back_link %}{% endblock back_link %}

{% block content %}
<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--white);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
    <div style="width:48px;height:48px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </div>
    <div>
        <div style="font-size:16px;font-weight:700;">Edit Separation — {{ employee.full_name }}</div>
        <div style="font-size:12px;color:var(--text-muted);">ID: {{ employee.employee_id|default:"Not assigned" }} | Fix left date or reason</div>
    </div>
</div>

<div class="card" style="max-width:600px;margin:0 auto;">
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Last Working Date *</label>
            <input type="date" name="last_working_date" class="form-control" required value="{{ separation.last_working_date|date:'Y-m-d' }}">
        </div>

        <div class="form-group">
            <label>Reason for Leaving *</label>
            <select name="separation_reason" class="form-control" required>
                <option value="resignation" {% if form.separation_reason.value == 'resignation' %}selected{% endif %}>Resignation</option>
                <option value="termination" {% if form.separation_reason.value == 'termination' %}selected{% endif %}>Termination</option>
                <option value="contract_end" {% if form.separation_reason.value == 'contract_end' %}selected{% endif %}>End of Contract</option>
                <option value="retirement" {% if form.separation_reason.value == 'retirement' %}selected{% endif %}>Retirement</option>
                <option value="other" {% if form.separation_reason.value == 'other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);">
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px 40px;font-size:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Update Separation
            </button>
        </div>
    </form>
</div>
{% endblock %}
