{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Module - Royal International School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg: #f8fafc;
            --white: #fff;
            --text: #1a1d23;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --blue: #2563eb;
            --green: #16a34a;
            --yellow: #d97706;
            --red: #dc2626;
            --purple: #9333ea;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); }

        .hr-layout { min-height:100vh; }
        .hr-main { padding:24px 32px; max-width:1200px; margin:0 auto; }

        .btn {
            display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
            border-radius:8px; font-size:13px; font-weight:600; text-decoration:none;
            border:none; cursor:pointer; transition:all .15s; font-family:inherit;
        }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-success { background:var(--green); color:#fff; }
        .btn-warning { background:#fffbeb; color:var(--yellow); border:1px solid #fde68a; }
        .btn-danger { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
        .btn-sm { padding:5px 10px; font-size:11px; }
        .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }

        .card { background:var(--white); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:20px; margin-bottom:20px; }
        .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
        .card-header h2 { font-size:15px; font-weight:700; }

        .table-scroll { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:600px; }
        th { padding:10px 14px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); background:#f9fafb; border-bottom:2px solid var(--border); }
        td { padding:10px 14px; font-size:13px; border-bottom:1px solid #f3f4f6; }
        tr:hover { background:#f9fafb; }

        .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card { background:var(--white); border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; align-items:center; gap:14px; }
        .stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .stat-info p { font-size:12px; color:var(--text-muted); margin-bottom:2px; }
        .stat-info h3 { font-size:20px; font-weight:700; }

        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:var(--text-secondary); }
        .form-control {
            width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
            font-size:13px; font-family:inherit; outline:none; transition:border-color .15s;
        }
        .form-control:focus { border-color:var(--primary); }
        .form-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }

        .toast {
            position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:10px;
            background:var(--green); color:#fff; font-size:13px; font-weight:600;
            box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:9999;
            animation:slideIn .3s ease;
        }
        @keyframes slideIn { from { transform:translateX(100px); opacity:0; } to { transform:none; opacity:1; } }

        .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:600; }
        .badge-green { background:#f0fdf4; color:var(--green); }
        .badge-red { background:#fef2f2; color:var(--red); }
        .badge-yellow { background:#fffbeb; color:var(--yellow); }
        .badge-blue { background:#eff6ff; color:var(--blue); }

        .amount { font-family:'Courier New',monospace; font-weight:600; }
    </style>
</head>
<body>
    <div class="hr-layout">
        <main class="hr-main">
            {% block back_link %}
            <div style="margin-bottom:16px;">
                <a href="{% url 'admin_console' %}" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--primary);text-decoration:none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                    Back to Dashboard
                </a>
            </div>
            {% endblock back_link %}
            {% if messages %}
            {% for message in messages %}
            <div class="toast">{{ message }}</div>
            {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        setTimeout(() => {
            document.querySelectorAll('.toast').forEach(t => t.style.display = 'none');
        }, 3000);
    </script>
</body>
</html>
