{% extends "hr/base_hr.html" %}

{% block content %}
<div class="hr-topbar">
    <div>
        <h1>{{ action }} Salary Structure — {{ employee.full_name }}</h1>
        <div class="breadcrumb">HR Module / Employees / {{ action }} Salary</div>
    </div>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label>Basic Salary (PKR)</label>
                <input type="number" name="basic_salary" value="{{ form.basic_salary.value|default:'0' }}" step="0.01" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Salary Type</label>
                <select name="salary_type" class="form-control">
                    <option value="monthly" {% if form.salary_type.value == 'monthly' %}selected{% endif %}>Monthly</option>
                    <option value="daily" {% if form.salary_type.value == 'daily' %}selected{% endif %}>Daily</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employment Type</label>
                <select name="employment_type" class="form-control">
                    <option value="permanent" {% if form.employment_type.value == 'permanent' %}selected{% endif %}>Permanent</option>
                    <option value="contract" {% if form.employment_type.value == 'contract' %}selected{% endif %}>Contract</option>
                    <option value="daily_wager" {% if form.employment_type.value == 'daily_wager' %}selected{% endif %}>Daily Wager</option>
                </select>
            </div>
            <div class="form-group">
                <label>Working Days/Week</label>
                <input type="number" name="working_days_per_week" value="{{ form.working_days_per_week.value|default:'6' }}" min="1" max="7" class="form-control">
            </div>
        </div>

        <h3 style="font-size:14px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Allowances</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Housing Allowance (PKR)</label>
                <input type="number" name="housing_allowance" value="{{ form.housing_allowance.value|default:'0' }}" step="0.01" class="form-control">
            </div>
            <div class="form-group">
                <label>Medical Allowance (PKR)</label>
                <input type="number" name="medical_allowance" value="{{ form.medical_allowance.value|default:'0' }}" step="0.01" class="form-control">
            </div>
            <div class="form-group">
                <label>Transport Allowance (PKR)</label>
                <input type="number" name="transport_allowance" value="{{ form.transport_allowance.value|default:'0' }}" step="0.01" class="form-control">
            </div>
            <div class="form-group">
                <label>Fuel Allowance (PKR)</label>
                <input type="number" name="fuel_allowance" value="{{ form.fuel_allowance.value|default:'0' }}" step="0.01" class="form-control">
            </div>
            <div class="form-group">
                <label>Other Allowance (PKR)</label>
                <input type="number" name="other_allowance" value="{{ form.other_allowance.value|default:'0' }}" step="0.01" class="form-control">
            </div>
        </div>

        <h3 style="font-size:14px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Bank Details</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Bank Name</label>
                <input type="text" name="bank_name" value="{{ form.bank_name.value|default:'' }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Account Number</label>
                <input type="text" name="bank_account" value="{{ form.bank_account.value|default:'' }}" class="form-control">
            </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn btn-primary">Save Salary Structure</button>
            <a href="{% url 'hr_employee_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
