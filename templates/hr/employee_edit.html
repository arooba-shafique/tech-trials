{% extends "hr/base_hr.html" %}

{% block content %}
<div class="hr-topbar">
    <div>
        <h1>Edit Employee — {{ employee.full_name }}</h1>
        <div class="breadcrumb">HR Module / Employees / Edit</div>
    </div>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <h3 style="font-size:14px;font-weight:700;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);">Personal Information</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ employee.full_name }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Father Name</label>
                <input type="text" name="father_name" value="{{ employee.father_name }}" class="form-control">
            </div>
            <div class="form-group">
                <label>CNIC</label>
                <input type="text" name="cnic" value="{{ employee.cnic }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender" class="form-control">
                    <option value="M" {% if employee.gender == 'M' %}selected{% endif %}>Male</option>
                    <option value="F" {% if employee.gender == 'F' %}selected{% endif %}>Female</option>
                </select>
            </div>
        </div>

        <h3 style="font-size:14px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Contact Information</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ employee.phone }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ employee.email|default:'' }}" class="form-control">
            </div>
            <div class="form-group" style="grid-column:span 2;">
                <label>Address</label>
                <input type="text" name="address" value="{{ employee.address }}" class="form-control">
            </div>
        </div>

        <h3 style="font-size:14px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Job Information</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Designation</label>
                <select name="designation" class="form-control">
                    {% for val, label in designation_choices %}
                    <option value="{{ val }}" {% if employee.designation == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Employment Type</label>
                <select name="employment_type" class="form-control">
                    <option value="permanent" {% if employee.employment_type == 'permanent' %}selected{% endif %}>Permanent</option>
                    <option value="contract" {% if employee.employment_type == 'contract' %}selected{% endif %}>Contract</option>
                    <option value="daily_wager" {% if employee.employment_type == 'daily_wager' %}selected{% endif %}>Daily Wager</option>
                </select>
            </div>
            <div class="form-group">
                <label>Basic Salary (PKR)</label>
                <input type="number" name="salary" value="{{ employee.salary }}" step="0.01" class="form-control">
            </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'hr_employee_detail' employee.id %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
