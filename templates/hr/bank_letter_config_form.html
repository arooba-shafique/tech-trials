{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Letter Details - {{ config.get_transaction_type_display }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:#f0f2f5; padding:20px; color:#1a1d23; }
        .form-container { background:#fff; border-radius:12px; max-width:640px; margin:20px auto; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }
        .form-header { padding:18px 24px; background:#8b2a87; color:#fff; }
        .form-header h2 { font-size:16px; font-weight:700; }
        .form-header p { font-size:12px; opacity:.85; margin-top:3px; }
        .form-body { padding:24px; display:flex; flex-direction:column; gap:16px; }
        label.field { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#6b7280; }
        textarea, input[type=text] { padding:10px 12px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:13.5px; font-family:inherit; outline:none; resize:vertical; }
        textarea:focus, input[type=text]:focus { border-color:#8b2a87; }
        .form-actions { display:flex; gap:10px; padding:0 24px 24px; }
        .btn-save { padding:10px 26px; background:#8b2a87; color:#fff; border:none; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
        .btn-save:hover { background:#6b1f68; }
        .btn-cancel { padding:10px 20px; background:#fff; color:#6b7280; border:1.5px solid #e5e7eb; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-flex; align-items:center; }
        .hint { font-size:11.5px; color:#9ca3af; font-weight:400; text-transform:none; letter-spacing:0; }
    </style>
</head>
<body>
    <form method="post" class="form-container">
        {% csrf_token %}
        <div class="form-header">
            <h2>Bank Letter Details — {{ config.get_transaction_type_display }}</h2>
            <p>Recipient address, subject line and signature shown on generated bank letters.</p>
        </div>
        <div class="form-body">
            <label class="field">
                Recipient Header <span class="hint">One line per row, e.g. "The Manager," / bank name / branch / city. Leave blank for cash letters.</span>
                <textarea name="recipient_header" rows="5">{{ config.recipient_header }}</textarea>
            </label>
            <label class="field">
                Subject Line
                <input type="text" name="subject" value="{{ config.subject }}">
            </label>
            <label class="field">
                Signature Name (e.g. CEO)
                <input type="text" name="signature_name" value="{{ config.signature_name }}">
            </label>
            <label class="field">
                Signature Organisation
                <input type="text" name="signature_org" value="{{ config.signature_org }}">
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-save">Save</button>
            <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
        </div>
    </form>
</body>
</html>
